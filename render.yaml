services:
  - type: web
    name: switch-docs-collaboration
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        value: DigitalRage/switch-docs
      - key: GITHUB_BRANCH
        value: main